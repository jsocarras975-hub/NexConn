services:
  postgres:
    image: postgres:16-alpine
    container_name: nexcon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexcon
      POSTGRES_PASSWORD: nexcon_dev_password
      POSTGRES_DB: nexcon
    ports:
      - "5432:5432"
    volumes:
      - nexcon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexcon -d nexcon"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nexcon_pgdata:
